[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-core"
version = "0.1.0"
description = "A local agent for managing and observing a homelab node"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psutil>=6,<7",
    "pydantic>=2.9,<3",
    "prometheus-client>=0.21,<1",
    "tomli-w>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
hardware = ["spidev>=3.6,<4", "RPi.GPIO>=0.7,<1"]

[project.scripts]
homelab-core = "homelab_core.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
